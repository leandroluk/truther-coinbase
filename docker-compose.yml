name: "truther-coingecko"

networks:
  truther-coingecko:
    name: "truther-coingecko"

services:
  truther-coingecko-postgres:
    image: "postgres"
    hostname: "postgres"
    container_name: "truther-coingecko-postgres"
    ports: ["${DOCKER_POSTGRES_PORT:?DOCKER_POSTGRES_PORT is required}:5432"]
    networks: ["truther-coingecko"]
    environment:
      POSTGRES_USER: "${DOCKER_POSTGRES_USERNAME:?DOCKER_POSTGRES_USERNAME is required}"
      POSTGRES_PASSWORD: "${DOCKER_POSTGRES_PASSWORD:?DOCKER_POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${DOCKER_POSTGRES_DATABASE:?DOCKER_POSTGRES_DATABASE is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      start_period: 10s

  truther-coingecko-redis:
    image: "redis/redis-stack-server"
    hostname: "redis"
    container_name: "truther-coingecko-redis"
    networks: ["truther-coingecko"]
    ports: ["${DOCKER_REDIS_PORT:?DOCKER_REDIS_PORT is required}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
